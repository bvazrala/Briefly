# Briefing Station broker config.
# Mosquitto 2.x binds to localhost only by default; this opens it to your
# hotspot network (so the ESP32 can reach it) WITH authentication.
#
# 1) create the password file next to this conf:
#      mosquitto_passwd -c passwd stationuser
# 2) fix the absolute path below, then run:
#      mosquitto -c mosquitto.conf -v

listener 1883 0.0.0.0
allow_anonymous false
password_file ./passwd
