; Briefing Station firmware - LILYGO TTGO T-Display (ESP32)
; Platform is PINNED so the code below matches the Arduino core APIs it was
; written for (core 2.x: ledcSetup/ledcAttachPin/ledcWriteTone).

[env:ttgo-t-display]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit CAP1188 Library@^1.1.1
    adafruit/Adafruit AHTX0@^2.0.5
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

; TFT_eSPI configured entirely from here (no library file edits needed).
; These mirror the library's Setup25_TTGO_T_Display.h.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
